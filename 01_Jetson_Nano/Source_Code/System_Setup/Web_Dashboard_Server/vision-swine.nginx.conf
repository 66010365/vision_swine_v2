server {
    listen 80;
    server_name _;

    root /var/www/vision-swine;
    index index.html;

    # React Dashboard
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Jetson Nano AI API + MJPEG Stream
    location /jetson-api/ {
        proxy_pass http://127.0.0.1:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # NAS Backend API
    location /nas-api/ {
        proxy_pass http://100.123.171.62:8002/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }
}
